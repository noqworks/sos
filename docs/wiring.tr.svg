<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="14" fill="#1d1d1d">
  <title>NOQ SOS bağlantı şeması</title>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- wires -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 115 H330 V140 H392" stroke="#1d1d1d" stroke-dasharray="7 6"/>
    <path d="M300 245 H342 V180 H392" stroke="#1d1d1d"/>
    <path d="M300 365 H352 V260 H392" stroke="#1d1d1d" stroke-dasharray="7 6"/>
    <path d="M568 180 H612 V145 H660" stroke="#8a8a8a" stroke-dasharray="6 6"/>
    <path d="M660 340 H630 V455 H520 V432" stroke="#8a8a8a" stroke-dasharray="6 6"/>
    <path d="M660 375 H650 V482 H440 V432" stroke="#d97706"/>
  </g>

  <!-- XIAO ESP32S3 -->
  <rect x="390" y="90" width="180" height="340" rx="18" fill="#f4f4f4"/>
  <rect x="450" y="76" width="60" height="22" rx="8" fill="#e2e2e2"/>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#6b6b6b">USB-C · şarj, kurulum</text>
  <text x="480" y="300" text-anchor="middle" font-weight="600">XIAO</text>
  <text x="480" y="320" text-anchor="middle" font-weight="600">ESP32S3</text>
  <text x="480" y="342" text-anchor="middle" font-size="12" fill="#6b6b6b">kartın LED'i: GPIO21</text>
  <g font-size="12">
    <text x="402" y="144">D0</text><text x="402" y="184" font-weight="600">D1</text><text x="402" y="224" fill="#8a8a8a">D2</text>
    <text x="402" y="264">D3</text><text x="402" y="304" fill="#8a8a8a">D4</text><text x="402" y="344" fill="#8a8a8a">D5</text>
    <text x="402" y="384" fill="#8a8a8a">D6</text>
    <text x="558" y="144" text-anchor="end" fill="#8a8a8a">5V</text><text x="558" y="184" text-anchor="end">GND</text>
    <text x="558" y="224" text-anchor="end">3V3</text><text x="558" y="264" text-anchor="end" fill="#8a8a8a">D10</text>
    <text x="558" y="304" text-anchor="end" fill="#8a8a8a">D9</text><text x="558" y="344" text-anchor="end" fill="#8a8a8a">D8</text>
    <text x="558" y="384" text-anchor="end" fill="#8a8a8a">D7</text>
  </g>
  <g fill="#1d1d1d">
    <circle cx="392" cy="140" r="4"/><circle cx="392" cy="180" r="4"/><circle cx="392" cy="260" r="4"/><circle cx="568" cy="180" r="4"/>
  </g>
  <rect x="428" y="424" width="24" height="12" rx="3" fill="#d97706"/>
  <rect x="508" y="424" width="24" height="12" rx="3" fill="#8a8a8a"/>
  <text x="440" y="416" text-anchor="middle" font-size="11">BAT+</text>
  <text x="520" y="416" text-anchor="middle" font-size="11">BAT−</text>
  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#6b6b6b">BAT+ / BAT− kartın arka yüzünde ped</text>

  <!-- battery reading -->
  <rect x="40" y="60" width="260" height="110" rx="16" fill="#f4f4f4"/>
  <text x="60" y="90" font-weight="600">Pil ölçümü</text><text x="280" y="90" text-anchor="end" font-size="12" fill="#6b6b6b">isteğe bağlı</text>
  <text x="60" y="114" font-size="12">BAT+ → 1 MΩ → D0 → 1 MΩ → GND</text>
  <text x="60" y="134" font-size="12">D0 ile GND arasına 100 nF (104) seramik</text>
  <text x="60" y="154" font-size="12" fill="#6b6b6b">yaklaşık 2 µA çeker</text>

  <!-- button -->
  <rect x="40" y="200" width="260" height="90" rx="16" fill="#f4f4f4"/>
  <text x="60" y="230" font-weight="600">Düğme</text>
  <text x="60" y="254" font-size="12">bir bacak → D1</text>
  <text x="60" y="274" font-size="12">çapraz bacak → GND, direnç yok</text>

  <!-- buzzer / vibration motor -->
  <rect x="40" y="320" width="260" height="220" rx="16" fill="#f4f4f4"/>
  <text x="60" y="350" font-weight="600">Buzzer ya da titreşim</text><text x="280" y="350" text-anchor="end" font-size="12" fill="#6b6b6b">isteğe bağlı</text>
  <text x="60" y="374" font-size="12">aktif buzzer, 20 mA'e kadar:</text>
  <text x="60" y="394" font-size="12">D3 → + , − → GND</text>
  <text x="60" y="424" font-size="12" font-weight="600">Titreşim motoru: bacağa doğrudan değil</text>
  <text x="60" y="444" font-size="12">D3 → 1 kΩ → NPN beyz (S8050, 2N2222)</text>
  <text x="60" y="464" font-size="12">emiter → GND, kolektör → motor −</text>
  <text x="60" y="484" font-size="12">motor + → 3V3</text>
  <text x="60" y="504" font-size="12">1N4148 motora paralel, bant 3V3'te</text>
  <text x="60" y="524" font-size="12" fill="#6b6b6b">100 kΩ beyz → GND: açılışta seğirmez</text>

  <!-- ground -->
  <rect x="660" y="90" width="260" height="110" rx="16" fill="#f4f4f4"/>
  <text x="680" y="120" font-weight="600">GND</text>
  <text x="680" y="144" font-size="12">düğme, bölücü, buzzer ve motor</text>
  <text x="680" y="164" font-size="12">hepsi buraya döner</text>

  <!-- cell -->
  <rect x="660" y="300" width="260" height="110" rx="16" fill="#f4f4f4"/>
  <text x="680" y="330" font-weight="600">LiPo pil, tek hücre</text>
  <text x="680" y="354" font-size="12">siyah → BAT−</text>
  <text x="680" y="378" font-size="12" fill="#b45309">kırmızı → BAT+</text>
  <text x="680" y="398" font-size="12" fill="#6b6b6b">3,7 ya da 3,85 V, USB'den şarj olur</text>
</svg>
